<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta http-equiv="content-type" content="text/html; charset=utf-8" />
<title>Login - JWT Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow p-4" style="max-width: 420px; width: 100%;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 text-primary fw-bold">JWT Authentication</h3>
            
            <ul class="nav nav-pills nav-justified mb-3" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#tab-login" type="button" role="tab">Login</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#tab-register" type="button" role="tab">Register</button>
                </li>
            </ul>

            <div class="tab-content" id="authTabContent">
                <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
                    <form action="" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" class="form-control" name="email" id="email" value="test@gmail.com" placeholder="test@gmail.com" required="required">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" class="form-control" name="password" id="password" value="123456" required="required" autocomplete="on">
                        </div>
                        <button id="login" type="button" class="btn btn-primary w-100 py-2">Login</button>
                    </form>
                </div>

                <div class="tab-pane fade" id="tab-register" role="tabpanel">
                    <form action="" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="regFullName">Full Name</label>
                            <input type="text" class="form-control" id="regFullName" placeholder="Nguyen Van A" required="required">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="regEmail">Email</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="user@gmail.com" required="required">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="regPassword">Password</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="Password" required="required" autocomplete="on">
                        </div>
                        <button id="btnRegister" type="button" class="btn btn-success w-100 py-2">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
